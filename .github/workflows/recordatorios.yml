# Cada 5 minutos le pide a la web que mande los recordatorios que ya tocan
name: Recordatorios

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/cron
        run: curl -fsS --retry 3 https://mis-habitos-chi.vercel.app/api/cron